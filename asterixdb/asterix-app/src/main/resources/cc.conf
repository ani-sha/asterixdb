[nc/asterix_nc1]
txn.log.dir=target/tmp/asterix_nc1/txnlog
core.dump.dir=target/tmp/asterix_nc1/coredump
iodevices=asterix_nc1/iodevice1,asterix_nc1/iodevice2
nc.api.port=19004

[nc/asterix_nc2]
txn.log.dir=target/tmp/asterix_nc2/txnlog
core.dump.dir=target/tmp/asterix_nc2/coredump
iodevices=asterix_nc2/iodevice1,asterix_nc2/iodevice2
nc.api.port=19005
ncservice.port=9091

[nc/asterix_nc3]
txn.log.dir=target/tmp/asterix_nc3/txnlog
core.dump.dir=target/tmp/asterix_nc3/coredump
iodevices=asterix_nc3/iodevice1,asterix_nc3/iodevice2
nc.api.port=19006
ncservice.port=9092

[nc/asterix_nc4]
txn.log.dir=target/tmp/asterix_nc4/txnlog
core.dump.dir=target/tmp/asterix_nc4/coredump
iodevices=asterix_nc4/iodevice1,asterix_nc4/iodevice2
nc.api.port=19007
ncservice.port=9093

[nc]
address=127.0.0.1
command=asterixnc
app.class=org.apache.asterix.hyracks.bootstrap.NCApplication
jvm.args=-Xmx4096m -Dnode.Resolver="org.apache.asterix.external.util.IdentityResolverFactory"
storage.buffercache.size=128MB
storage.memorycomponent.globalbudget=512MB
storage.io.scheduler=greedy
storage.filtered.memorycomponent.max.size=16MB

[cc]
address=127.0.0.1
app.class=org.apache.asterix.hyracks.bootstrap.CCApplication
heartbeat.period=20000
heartbeat.max.misses=25

[common]
log.dir=logs/
log.level=DEBUG
compiler.framesize=32KB
compiler.sortmemory=320KB
compiler.groupmemory=160KB
compiler.joinmemory=256KB
compiler.textsearchmemory=160KB
compiler.windowmemory=192KB
compiler.sort.parallel=false
compiler.internal.sanitycheck=true
compiler.ordered.fields=false
messaging.frame.size=4096
messaging.frame.count=512
storage.buffercache.pagesize=32KB
